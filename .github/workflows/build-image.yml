name: Build image

on:
  push:
    branches:
      - master
    paths:
      - Dockerfile
      - .github/workflows/build-image.yml
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/build-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Derive the image tag from the Dockerfile
        id: tag
        run: |
          set -eu
          nginx="$(sed -n 's/^FROM nginx:\([0-9][0-9.]*\).*$/\1/p' Dockerfile)"
          proxy="$(sed -n 's|^FROM nginxproxy/nginx-proxy:\([^ ]*\).*$|\1|p' Dockerfile)"
          if [ -z "$nginx" ] || [ -z "$proxy" ]; then
            echo "::error::Could not read the nginx and nginx-proxy versions from Dockerfile"
            exit 1
          fi
          echo "tag=${proxy}-nginx${nginx}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The tag lives in two places: derived from the Dockerfile here, and
      # pinned in docker-compose.yml. Surface a mismatch instead of letting the
      # deployment drift to an older image.
      - name: Check the compose reference
        if: github.event_name != 'pull_request'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}:${{ steps.tag.outputs.tag }}"
          pinned="$(sed -n 's/^[[:space:]]*image:[[:space:]]*//p' docker-compose.yml | head -n1)"
          if [ "$pinned" != "$image" ]; then
            echo "::warning::docker-compose.yml pins '$pinned', but this build published '$image'"
            {
              echo "### docker-compose.yml is out of date"
              echo
              echo "Published: \`$image\`"
              echo
              echo "Pinned: \`$pinned\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
