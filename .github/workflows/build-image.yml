name: Build image

on:
  push:
    branches:
      - master
    paths:
      - Dockerfile
      - .github/workflows/build-image.yml
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/build-image.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Derive the image tag from the Dockerfile
        id: tag
        run: |
          set -eu
          nginx="$(sed -n 's/^FROM nginx:\([0-9][0-9.]*\).*$/\1/p' Dockerfile)"
          proxy="$(sed -n 's|^FROM nginxproxy/nginx-proxy:\([^ ]*\).*$|\1|p' Dockerfile)"
          if [ -z "$nginx" ] || [ -z "$proxy" ]; then
            echo "::error::Could not read the nginx and nginx-proxy versions from Dockerfile"
            exit 1
          fi
          echo "tag=${proxy}-nginx${nginx}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The tag lives in two places: derived from the Dockerfile above, and
      # pinned in docker-compose.yml. When they differ, open a pull request
      # that bumps the pin instead of leaving the deployment on an older image.
      - name: Pin the published image in docker-compose.yml
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY}:${{ steps.tag.outputs.tag }}"
          pinned="$(sed -n 's/^[[:space:]]*image:[[:space:]]*//p' docker-compose.yml | head -n1)"
          if [ "$pinned" = "$image" ]; then
            echo "docker-compose.yml already pins $image"
            exit 0
          fi

          OLD="$pinned" NEW="$image" python3 -c '
          import os, pathlib
          path = pathlib.Path("docker-compose.yml")
          old, new = os.environ["OLD"], os.environ["NEW"]
          text = path.read_text()
          if old not in text:
              raise SystemExit("pinned image not found in docker-compose.yml")
          path.write_text(text.replace(old, new, 1))
          '

          branch="chore/pin-proxy-image"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docker-compose.yml
          git commit -m "chore: pin the proxy image to ${{ steps.tag.outputs.tag }}"
          git push --force origin "$branch"

          if gh pr list --head "$branch" --state open --json number --jq '.[].number' | grep -q .; then
            echo "updated the open pull request for $branch"
          else
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$branch" \
              --title "chore: pin the proxy image to ${{ steps.tag.outputs.tag }}" \
              --body "The workflow published $image. Merge, then run: docker compose -p proxy pull && docker compose -p proxy up -d"
          fi
