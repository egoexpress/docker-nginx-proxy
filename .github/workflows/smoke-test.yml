name: Smoke test

on:
  push:
    branches:
      - master
    paths:
      - Dockerfile
      - files/**
      - test/**
      - .github/workflows/smoke-test.yml
  pull_request:
    paths:
      - Dockerfile
      - files/**
      - test/**
      - .github/workflows/smoke-test.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the image locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: nginx-proxy:test
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=smoke

      # The tag is built from the Dockerfile, so the image must carry exactly
      # the nginx version the Dockerfile names. This is the check that fails
      # when a base image bump or a broken COPY slips through.
      - name: Check the nginx version against the Dockerfile
        run: |
          set -eu
          want="$(sed -n 's/^FROM nginx:\([0-9][0-9.]*\).*$/\1/p' Dockerfile)"
          got="$(docker run --rm --entrypoint nginx nginx-proxy:test -v 2>&1 | sed 's|.*nginx/||')"
          echo "Dockerfile: $want"
          echo "Image:      $got"
          test "$got" = "$want"

      - name: Run the smoke test
        run: ./test/smoke.sh nginx-proxy:test
